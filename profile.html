<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNATURE CARD</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+JP:wght@200;300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;--bg2:#0e0e0e;--bg3:#151515;
  --gold:#B8915A;--gold2:#D4B070;
  --white:#EDE8E0;--gray:#9a9a94;--gray2:#6a6a64;
  --line:rgba(184,145,90,0.15);--line2:rgba(255,255,255,0.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;font-weight:200;background:var(--bg);color:var(--white);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line2);position:sticky;top:0;z-index:100;background:rgba(7,7,7,0.97);backdrop-filter:blur(12px);}
.hdr-l{display:flex;align-items:center;gap:11px;}
.emblem{width:22px;height:22px;border:1px solid var(--gold);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.emblem img{width:100%;height:100%;object-fit:cover;display:block;}
.brand{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.22em;color:var(--white);font-weight:300;}
.brand-sub{font-size:5.5px;letter-spacing:.18em;color:var(--gray);display:block;margin-top:2px;text-transform:uppercase;}
.hdr-share{width:30px;height:30px;border:1px solid rgba(184,145,90,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);cursor:pointer;background:transparent;}

/* Loading/Error */
.loading{text-align:center;padding:80px 20px;color:var(--gray2);font-size:10px;letter-spacing:.2em;}
.error{text-align:center;padding:80px 20px;}
.error h2{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--white);margin-bottom:8px;}
.error p{font-size:13px;color:var(--gray);}

/* Cover */
.card-cover{width:100%;height:160px;background:#0f0d09;position:relative;overflow:hidden;}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;}
.cover-line{position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,var(--gold) 20%,var(--gold2) 55%,transparent 100%);}

/* Photo */
.photo-wrap{display:flex;justify-content:center;margin-top:-33px;margin-bottom:24px;position:relative;z-index:10;}
.card-photo{width:66px;height:66px;border-radius:50%;border:1.5px solid var(--gold);background:var(--bg2);object-fit:cover;display:block;}
.photo-ph{width:66px;height:66px;border-radius:50%;border:1.5px solid var(--gold);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold);}

/* Identity */
.identity{text-align:center;padding:0 28px 28px;}
.tag-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;}
.tag{border:1px solid rgba(184,145,90,0.35);padding:4px 12px;font-size:6.5px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;}
.tag-sep{color:var(--gray2);font-size:9px;}
.tag-txt{font-size:7.5px;color:var(--gray);letter-spacing:.06em;}
.co-logo-wrap{display:flex;justify-content:center;margin-bottom:12px;}
.co-logo-wrap img{width:48px;height:48px;border-radius:5px;object-fit:contain;background:var(--bg3);border:1px solid rgba(184,145,90,0.2);}
.co-logo-ph{width:48px;height:48px;border-radius:5px;background:var(--bg3);border:1px solid rgba(184,145,90,0.2);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:16px;color:rgba(184,145,90,0.3);}
.card-company{font-size:8.5px;color:var(--gray);letter-spacing:.06em;margin-bottom:4px;}
.card-dept-title{font-size:8px;color:var(--gray2);margin-bottom:8px;}
.card-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;letter-spacing:.06em;color:var(--white);margin-bottom:4px;}
.card-kana{font-size:8px;color:var(--gray2);letter-spacing:.14em;margin-bottom:10px;text-transform:uppercase;}
.card-catch{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12.5px;color:var(--gold);letter-spacing:.04em;line-height:1.8;}

/* Icon row */
.icon-row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);}
.ico-item{display:flex;flex-direction:column;align-items:center;padding:18px 8px;gap:7px;border-right:1px solid var(--line2);cursor:pointer;text-decoration:none;}
.ico-item:last-child{border-right:none;}
.ico-c{width:38px;height:38px;border-radius:50%;background:var(--bg2);border:1px solid rgba(184,145,90,0.2);display:flex;align-items:center;justify-content:center;color:var(--gold);}
.ico-c svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.ico-lbl{font-size:6.5px;letter-spacing:.12em;color:var(--gray2);text-transform:uppercase;}

/* Sections */
.section{padding:28px 22px 0;}
.sec-title{font-size:6.5px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid rgba(184,145,90,0.1);}
.sec-divider{height:1px;background:var(--line2);margin:28px 22px 0;}

/* Contact 3-col */
.contact-list{display:flex;flex-direction:column;gap:20px;}
.contact-item{display:grid;grid-template-columns:48px 52px 1fr;align-items:center;}
.ci-ico{width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid rgba(184,145,90,0.2);display:flex;align-items:center;justify-content:center;}
.ci-ico svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.ci-label{font-size:6.5px;letter-spacing:.22em;color:var(--gray);text-transform:uppercase;padding-left:10px;}
.ci-value{font-size:12px;color:var(--white);letter-spacing:.03em;line-height:1.7;padding-left:10px;word-break:break-all;}
.ci-value a{color:var(--white);text-decoration:none;}

/* Free text */
.free-text{font-size:11.5px;color:var(--gray);line-height:2.2;letter-spacing:.04em;white-space:pre-wrap;word-break:break-word;}

/* SNS pills */
.sns-area{display:flex;flex-wrap:wrap;gap:9px;}
.sns-tag{border:1px solid rgba(184,145,90,0.3);padding:7px 16px;border-radius:50px;font-size:9px;letter-spacing:.1em;color:var(--gold);text-decoration:none;}

/* CTA */
.cta-area{display:flex;flex-direction:column;gap:0;}
.cta-btn{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line2);text-decoration:none;color:var(--white);font-size:11px;letter-spacing:.04em;}
.cta-btn:last-child{border-bottom:none;}
.cta-ico{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:1px solid rgba(184,145,90,0.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);font-size:14px;}
.cta-arr{margin-left:auto;color:var(--gray2);}

/* Map */
.map-box{height:80px;background:#090907;border:1px solid rgba(184,145,90,0.12);border-radius:5px;position:relative;overflow:hidden;margin-bottom:24px;}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(184,145,90,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(184,145,90,0.05) 1px,transparent 1px);background-size:20px 20px;}
.map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;gap:4px;}
.map-dot{width:7px;height:7px;background:var(--gold);border-radius:50%;}
.map-lbl{font-size:6.5px;color:var(--gold);letter-spacing:.1em;white-space:nowrap;}

/* Buttons */
.btn-wrap{padding:28px 22px 0;}
.save-btn{width:100%;padding:16px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.28em;text-align:center;border-radius:3px;margin-bottom:10px;cursor:pointer;}
.share-btn{width:100%;padding:14px;border:1px solid var(--line2);background:transparent;color:var(--gray2);font-size:9px;letter-spacing:.2em;text-align:center;border-radius:3px;cursor:pointer;margin-bottom:0;}

/* Bottom nav */
.footnav{display:flex;justify-content:space-around;padding:16px 0 28px;border-top:1px solid var(--line2);margin-top:28px;}
.fn-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-decoration:none;}
.fn-ico{font-size:18px;color:var(--gray2);}
.fn-ico.on{color:var(--gold);}
.fn-lbl{font-size:6px;letter-spacing:.12em;color:var(--gray2);text-transform:uppercase;}
.fn-lbl.on{color:var(--gold);}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <div class="emblem"><img src="https://kkatsura-pixel.github.io/digital-meishi/SC_logo.png" alt="SC"></div>
    <div>
      <span class="brand">SIGNATURE CARD</span>
      <span class="brand-sub">Executive Digital Meishi Service</span>
    </div>
  </div>
  <button class="hdr-share" onclick="shareProfile()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
  </button>
</header>

<div class="loading" id="loading">読み込み中...</div>
<div id="content" style="display:none"></div>
<div class="error" id="error" style="display:none">
  <h2>名刺が見つかりません</h2>
  <p>URLが正しいかご確認ください。</p>
</div>

<script>
const WORKER_URL = 'https://loop-gemini-proxy.koshiro-katsura.workers.dev';

async function loadProfile() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id) { showError(); return; }

  try {
    const res = await fetch(`${WORKER_URL}/profile?id=${id}`);
    if(!res.ok) { showError(); return; }
    const d = await res.json();
    renderProfile(d);
  } catch(e) {
    showError();
  }
}

function renderProfile(d) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.title = `${d.name} | Signature Card`;

  const CTA_LABELS = {
    line:'LINE相談', booking:'予約する', hp:'HPを見る',
    seminar:'セミナー申込', contact:'お問い合わせ', other:'リンク'
  };
  const LINK_LABELS = {
    hp:'HP', lp:'LP', shop:'Shop', blog:'Blog', portfolio:'Portfolio', other:'Link'
  };

  // カバー
  let coverHtml = '<div style="width:100%;height:100%;background:linear-gradient(160deg,#141008 0%,#1e170b 40%,#0c0a06 100%);"></div>';
  if(d.coverUrl) coverHtml = `<img src="${d.coverUrl}" alt="cover">`;

  // プロフィール写真
  let photoHtml = `<div class="photo-ph">${(d.name||'').charAt(0)}</div>`;
  if(d.photoUrl) photoHtml = `<img src="${d.photoUrl}" class="card-photo" alt="photo">`;

  // ロゴ
  let logoHtml = `<div class="co-logo-ph">${(d.company||'').charAt(0)}</div>`;
  if(d.logoUrl) logoHtml = `<img src="${d.logoUrl}" alt="logo">`;

  // アイコン行
  let iconRow = '';
  // 基本4つ: Phone・Email・Web・LINE。不足時は住所→SNSで補完
  const firstLink = d.links && d.links.find(l=>l.url);
  const basicIcons = [];
  if(d.phone) basicIcons.push(`<a class="ico-item" href="tel:${d.phone}"><div class="ico-c"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.29 6.29l1.28-1.28a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></div><div class="ico-lbl">Phone</div></a>`);
  if(d.email) basicIcons.push(`<a class="ico-item" href="mailto:${d.email}"><div class="ico-c"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div class="ico-lbl">Email</div></a>`);
  if(firstLink) basicIcons.push(`<a class="ico-item" href="${firstLink.url}" target="_blank"><div class="ico-c"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div><div class="ico-lbl">Web</div></a>`);
  if(d.line) basicIcons.push(`<a class="ico-item" href="https://line.me/ti/p/~${d.line}"><div class="ico-c"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div><div class="ico-lbl">LINE</div></a>`);
  // 4つに満たない場合は住所→SNSで補完
  if(basicIcons.length < 4 && d.address) basicIcons.push(`<a class="ico-item" href="https://maps.google.com/?q=${encodeURIComponent(d.address)}" target="_blank"><div class="ico-c"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div><div class="ico-lbl">Map</div></a>`);
  if(basicIcons.length < 4 && d.instagram) basicIcons.push(`<a class="ico-item" href="https://instagram.com/${d.instagram.replace('@','')}" target="_blank"><div class="ico-c"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></div><div class="ico-lbl">Instagram</div></a>`);
  iconRow = basicIcons.join('');

  // Contact
  const contacts = [];
  if(d.phone) contacts.push({ico:'<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.29 6.29l1.28-1.28a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>',label:'TEL',value:`<a href="tel:${d.phone}">${d.phone}</a>`});
  if(d.email) contacts.push({ico:'<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',label:'MAIL',value:`<a href="mailto:${d.email}">${d.email}</a>`});
  if(d.address) contacts.push({ico:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',label:'住所',value:d.address});
  if(d.links && d.links.length) d.links.forEach(l=>{
    const label = LINK_LABELS[l.type]||'Link';
    contacts.push({ico:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>',label,value:`<a href="${l.url}" target="_blank">${l.url}</a>`});
  });

  let contactHtml = contacts.map(c=>`<div class="contact-item"><div class="ci-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#B8915A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${c.ico}</svg></div><div class="ci-label">${c.label}</div><div class="ci-value">${c.value}</div></div>`).join('');

  // SNS
  const sns = [];
  if(d.line) sns.push({label:'LINE',url:`https://line.me/ti/p/~${d.line}`});
  if(d.instagram) sns.push({label:'Instagram',url:`https://instagram.com/${d.instagram.replace('@','')}`});
  if(d.twitter) sns.push({label:'X',url:`https://x.com/${d.twitter.replace('@','')}`});
  if(d.facebook) sns.push({label:'Facebook',url:d.facebook.startsWith('http')?d.facebook:`https://${d.facebook}`});
  if(d.linkedin) sns.push({label:'LinkedIn',url:d.linkedin.startsWith('http')?d.linkedin:`https://${d.linkedin}`});
  let snsHtml = sns.map(s=>`<a href="${s.url}" class="sns-tag" target="_blank">${s.label}</a>`).join('');

  // CTA
  let ctaHtml = '';
  if(d.cta && d.cta.length) ctaHtml = d.cta.map(c=>`<a href="${c.url}" class="cta-btn" target="_blank"><div class="cta-ico">›</div>${CTA_LABELS[c.type]||c.type}<span class="cta-arr">›</span></a>`).join('');

  // Address for map
  const addrShort = d.address ? d.address.substring(0,12) : '';

  let html = `
    <div class="card-cover">${coverHtml}<div class="cover-line"></div></div>
    <div class="photo-wrap">${photoHtml}</div>
    <div class="identity">
      ${d.company?`<div class="tag-row"><div class="tag">${d.company}</div>${d.catchcopy?`<span class="tag-sep">·</span><span class="tag-txt">${d.catchcopy}</span>`:''}</div>`:''}
      <div class="co-logo-wrap">${logoHtml}</div>
      <div class="card-company">${d.company||''}</div>
      <div class="card-dept-title">${[d.dept,d.title].filter(Boolean).join(' / ')}</div>
      <div class="card-name">${d.name||''}</div>
      ${d.nameKana?`<div class="card-kana">${d.nameKana}</div>`:''}
      ${d.catchcopy?`<div class="card-catch">${d.catchcopy}</div>`:''}
    </div>
    ${iconRow?`<div class="icon-row">${iconRow}</div>`:''}
    ${contactHtml?`<div class="sec-divider"></div><div class="section"><div class="sec-title">Contact</div><div class="contact-list">${contactHtml}</div></div>`:''}
    ${d.freeText?`<div class="sec-divider"></div><div class="section"><div class="sec-title">About</div><div class="free-text">${d.freeText.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div></div>`:''}
    ${snsHtml?`<div class="sec-divider"></div><div class="section"><div class="sec-title">SNS &amp; Links</div><div class="sns-area">${snsHtml}</div></div>`:''}
    ${ctaHtml?`<div class="sec-divider"></div><div class="section"><div class="sec-title">Action</div><div class="cta-area">${ctaHtml}</div></div>`:''}
    ${d.address?`<div class="sec-divider"></div><div class="section"><div class="sec-title">Location</div><div id="google-map" style="width:100%;height:200px;border-radius:5px;border:1px solid rgba(184,145,90,0.12);margin-bottom:24px;overflow:hidden;"></div></div>`:''}
    <div class="btn-wrap">
      <button class="save-btn" onclick="saveContact()">連 絡 先 に 保 存 す る</button>
      <button class="share-btn" onclick="shareProfile()">URL を コ ピ ー し て 共 有</button>
    </div>
    <nav class="footnav">
      <a class="fn-item" href="javascript:void(0)" onclick="showQR()">
        <svg class="fn-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/></svg>
        <div class="fn-lbl">QR</div>
      </a>
      <a class="fn-item" href="profile.html?id=${d.uid}">
        <svg class="fn-ico on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div class="fn-lbl on">Card</div>
      </a>
      <a class="fn-item" href="https://kkatsura-pixel.github.io/digital-meishi/Signature-Card-v4.html">
        <svg class="fn-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
        <div class="fn-lbl">Settings</div>
      </a>
    </nav>
  `;

  document.getElementById('content').innerHTML = html;
  window._profileData = d;
  if(d.address) {
    initGoogleMap(d.address);
  }
}

async function initGoogleMap(address) {
  const mapEl = document.getElementById('google-map');
  if(!mapEl) return;
  try {
    const res = await fetch(`${WORKER_URL}/maps?address=${encodeURIComponent(address)}`);
    const data = await res.json();
    if(!data.embedUrl) return;
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'width:100%;height:100%;border:0;';
    iframe.loading = 'lazy';
    iframe.allowFullscreen = true;
    iframe.src = data.embedUrl;
    mapEl.appendChild(iframe);
  } catch(e) {
    console.error('Map error:', e);
  }
}

function showQR() {
  alert('QR表示機能は準備中です');
}

function saveContact() {
  const d = window._profileData;
  if(!d) return;
  const vcard = [
    'BEGIN:VCARD','VERSION:3.0',
    `FN:${d.name}`,
    d.nameKana ? `SOUND;X-IRMC-N:${d.nameKana}` : '',
    `ORG:${d.company}${d.dept?';'+d.dept:''}`,
    d.title   ? `TITLE:${d.title}` : '',
    d.phone   ? `TEL;TYPE=WORK,VOICE:${d.phone}` : '',
    d.fax     ? `TEL;TYPE=WORK,FAX:${d.fax}` : '',
    d.email   ? `EMAIL;TYPE=WORK:${d.email}` : '',
    d.address ? `ADR;TYPE=WORK:;;${d.address};;;;` : '',
    d.freeText? `NOTE:${d.freeText}` : '',
    `URL:${window.location.href}`,
    'END:VCARD'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([vcard], {type:'text/vcard'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${d.name.replace(/\s/g,'_')}.vcf`;
  a.click();
}

function shareProfile() {
  if(navigator.share) {
    navigator.share({title:`${window._profileData?.name||''}の名刺`, url:window.location.href});
  } else {
    navigator.clipboard.writeText(window.location.href).then(()=>alert('URLをコピーしました'));
  }
}

function showError() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'block';
}

loadProfile();
</script>
